<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miguel Angel Tejada · NFC</title>
  <style>
    :root {
      --bg: #0c0c0f;
      --card: #141418;
      --accent: #3a9bdc;
      --text: #f0f0f4;
      --muted: #9a9aa8;
      --border: rgba(255,255,255,0.08);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2rem 1.5rem 1.75rem;
      width: 100%;
      max-width: 360px;
      text-align: center;
      position: relative;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      overflow: hidden;
    }

    /* Light sweep animation */
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 60%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(58, 155, 220, 0.08) 40%,
        rgba(255, 255, 255, 0.18) 50%,
        rgba(58, 155, 220, 0.08) 60%,
        transparent 100%
      );
      animation: lightSweep 7s ease-in-out infinite;
      pointer-events: none;
      z-index: 1;
    }

    @keyframes lightSweep {
      0% {
        left: -100%;
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      45% {
        left: 140%;
        opacity: 1;
      }
      55% {
        opacity: 0;
      }
      100% {
        left: 140%;
        opacity: 0;
      }
    }

    /* Sober 3D cube */
    .cube-wrap {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 22px;
      height: 22px;
      perspective: 120px;
      opacity: 0.45;
      z-index: 2;
    }
    .cube {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      animation: cubeSpin 18s linear infinite;
    }
    .cube div {
      position: absolute;
      width: 22px;
      height: 22px;
      background: rgba(58,155,220,0.12);
      border: 1px solid rgba(58,155,220,0.4);
    }
    .cube .front  { transform: translateZ(11px); }
    .cube .back   { transform: rotateY(180deg) translateZ(11px); }
    .cube .right  { transform: rotateY(90deg) translateZ(11px); }
    .cube .left   { transform: rotateY(-90deg) translateZ(11px); }
    .cube .top    { transform: rotateX(90deg) translateZ(11px); }
    .cube .bottom { transform: rotateX(-90deg) translateZ(11px); }

    @keyframes cubeSpin {
      to { transform: rotateX(360deg) rotateY(360deg); }
    }

    .avatar {
      width: 108px;
      height: 108px;
      border-radius: 50%;
      margin: 0 auto 1.1rem;
      object-fit: cover;
      border: 2px solid rgba(255,255,255,0.12);
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      position: relative;
      z-index: 2;
    }

    h1 {
      font-size: 1.55rem;
      font-weight: 650;
      letter-spacing: -0.02em;
      margin-bottom: 0.25rem;
      color: #ffffff;
      position: relative;
      z-index: 2;
    }

    .subtitle {
      font-size: 0.88rem;
      color: var(--muted);
      font-weight: 500;
      margin-bottom: 0.75rem;
      line-height: 1.35;
      position: relative;
      z-index: 2;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      justify-content: center;
      margin: 0.6rem 0 1rem;
      position: relative;
      z-index: 2;
    }

    .tag {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      font-size: 0.68rem;
      color: var(--muted);
    }

    .location {
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 1.35rem;
      position: relative;
      z-index: 2;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      position: relative;
      z-index: 2;
    }

    a.btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      padding: 0.78rem 1rem;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 550;
      font-size: 0.92rem;
      color: var(--text);
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      transition: all 0.2s ease;
    }

    a.btn:hover {
      background: rgba(58,155,220,0.12);
      border-color: rgba(58,155,220,0.35);
      transform: translateY(-1px);
    }

    .btn-save {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .btn-save:hover {
      background: #2e8bc9;
      border-color: #2e8bc9;
    }

    .btn-soon {
      opacity: 0.55;
      cursor: default;
    }
    .btn-soon:hover {
      transform: none;
      background: rgba(255,255,255,0.04);
    }

    .soon-note {
      font-size: 0.65rem;
      opacity: 0.8;
    }

    .footer {
      margin-top: 1.4rem;
      font-size: 0.72rem;
      color: var(--muted);
      position: relative;
      z-index: 2;
    }
  </style>
</head>
